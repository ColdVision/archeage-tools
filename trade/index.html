<style>
:root{--bg:#1C1714;--card:#251E19;--ink:#E8DFD4;--mute:#9C8B7A;--line:#4A3F35;--acc:#C9A962;--acc2:#C9A962;--bad:#E07A80;--good:#8FC98F;--warn:#2E251B;--leather:#3D332B;--crimson:#8B2635}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1900px;margin:0 auto;padding:12px 16px}
.wrap>.card,.wrap>.note,.wrap>#t-sub,.wrap>footer{max-width:1100px;margin-left:auto;margin-right:auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header .row{position:fixed;top:12px;right:16px;z-index:40}
header .row label>span{display:none}
header .row select{min-height:36px;padding:4px 10px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px 0}
.note{background:var(--warn);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--ink)}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
input[type=number]{width:110px}
button{cursor:pointer}button.on,button:hover{border-color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td input[type=number]{width:84px;padding:3px 5px}
.scroll{overflow:auto;max-height:430px}
.mapwrap{position:relative}
.mapbox{height:72vh;min-height:460px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#111;cursor:grab}
.mapin{position:relative}
.mapin img.bg{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.mapin svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;width:34px;height:34px;transform:translate(-50%,-100%);cursor:pointer;touch-action:none;filter:drop-shadow(0 2px 3px #000b)}
.pin img{width:100%;height:100%;display:block;pointer-events:none}
.pin.sel,.pin.dst{filter:drop-shadow(0 0 7px #ffd34d) drop-shadow(0 0 2px #ffd34d);z-index:3}
.pin.org{filter:drop-shadow(0 0 7px #7bd08a) drop-shadow(0 0 2px #7bd08a);z-index:4}
.pin span{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:600 12px/1.1 Georgia,serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;width:max-content;max-width:150px;white-space:normal;text-align:center;pointer-events:none}
.chips button{margin:2px 4px 2px 0;padding:2px 8px;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.res div{border:1px solid var(--line);border-radius:6px;padding:8px}.res b{display:block;font-size:19px}
footer{font-size:13px;color:var(--mute);padding:10px 0 30px}footer a{color:var(--acc2)}
details summary{cursor:pointer;color:var(--acc)}

.app{display:flex;height:calc(100vh - 56px);min-height:600px;margin:10px calc(50% - 50vw);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:#000}
.mapbox{scrollbar-width:none;touch-action:none}.mapbox::-webkit-scrollbar{display:none}
#left{flex:0 0 clamp(640px,61vw,1160px);min-width:0;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line)}
.catalog-head{padding:16px 18px 12px}
.catalog-head h2{margin:0 0 10px;color:var(--acc);font-size:23px}
.catalog-controls{display:flex;flex-wrap:wrap;gap:8px}
.catalog-controls input,.catalog-controls select{min-height:42px;max-width:100%}
.catalog-controls input{flex:1 1 220px;min-width:0;padding-inline:12px}
.catalog-controls input::placeholder{color:var(--mute)}
.catalog-controls select{flex:1 1 152px;min-width:0}
.reward-filter{display:flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s)}
.reward-filter button{min-height:34px;padding:4px 10px;border:1px solid transparent;background:transparent;font-size:14px}
.reward-filter button[aria-pressed=true]{color:var(--acc);background:var(--leather);border-color:var(--line)}
.reward-filter [data-reward=gold]{color:var(--gold)}
.reward-filter [data-reward=items]{color:var(--acc)}
.catalog-status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin:9px 0 0;color:var(--mute);font-size:13px}
.catalog-scroll{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain;scrollbar-gutter:stable}
.pack-table{table-layout:fixed;font-size:14px}
.pack-table[hidden]{display:none}
.pack-table .col-pack{width:34%}.pack-table .col-origin{width:16%}.pack-table .col-dest{width:23%}.pack-table .col-reward{width:27%}
.pack-table thead th{z-index:1;padding:9px 12px;background:var(--leather);color:var(--ink);font-size:13px;text-shadow:none}
.pack-table thead th:first-child,.pack-table .pack-main{padding-left:18px}
.pack-table tbody th,.pack-table tbody td{position:static;padding:8px 12px;overflow-wrap:anywhere;vertical-align:middle}
.pack-table tbody .pack-main,.pack-table tbody .pack-origin{vertical-align:top;padding-top:12px;background:var(--card);font-size:14px;font-weight:500}
.pack-table tbody+tbody tr:first-child>*{border-top:2px solid var(--line)}
.pack-name{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;font-weight:650;line-height:1.3}
.pack-icon{width:34px;height:34px;flex:none;object-fit:contain}
.pack-materials{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 7px}
.pack-materials li,.reward-value{display:flex;align-items:center;gap:5px;min-width:0}
.pack-materials li{min-width:0;max-width:100%;padding:2px 5px;border:1px solid var(--line);border-radius:5px;font-size:12px;line-height:1.3;color:var(--mute)}
.pack-materials strong{color:var(--ink);font-weight:650}
.material-icon,.reward-icon{width:20px;height:20px;flex:none;object-fit:contain}
.pack-meta{margin:7px 0 0;font-size:12px;color:var(--mute)}
.origin-label{display:none}
.pack-table .route-post,.pack-table .route-reward{cursor:pointer}
.route-post button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:30px;padding:0;border:0;border-radius:4px;background:transparent;text-align:left;line-height:1.3;color:var(--ink)}
.route-post button:hover,.route-post button:active{background:transparent;transform:none}
.route-arrow{color:var(--mute);flex:none}
.reward-value{font-weight:600;line-height:1.3}
.reward-value.gold{color:var(--gold)}
.reward-value.items{color:var(--acc)}
.pack-table tr.selected :is(.route-post,.route-reward){background:var(--glow)}
.pack-table tr.selected .route-arrow{color:var(--acc)}
.catalog-empty{padding:18px;color:var(--mute)}
#mapcol{display:flex;position:relative;flex:1;flex-direction:column;min-width:0;background:var(--card);scroll-margin-top:var(--aa-head-h,0)}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#mapcol .mapbox{flex:1;height:auto;min-height:0;border:0;border-radius:0}
.mapinfo{min-width:0;color:var(--mute);font-size:13px}
.map-route{display:block;color:var(--ink);font-size:15px;line-height:1.3;margin-bottom:4px}
.maptools{display:flex;flex:none;gap:5px}
.maptools button{min-width:38px;min-height:38px;padding:4px 8px}
#map-back{display:none}
body[data-page=trade] #aa-donate{position:static;margin:16px auto}
@media (max-width:980px){
  body[data-page=trade] #sec-map{flex-direction:column;height:auto}

  #mapcol{flex:auto;height:62vh;height:62svh}
  #map-back{display:block}
}
@media (max-width:820px){#mapcol,body[data-page=trade] #left{scroll-margin-top:0}}
@media (max-width:620px){

  .catalog-controls select{flex:1 1 110px;min-width:110px}
  .reward-filter button{padding-inline:7px}
  .catalog-status{font-size:12px;margin-top:6px}
  .catalog-scroll{padding:0 10px 10px;scrollbar-gutter:auto}
  .pack-table,.pack-table tbody{display:block}
  .pack-table colgroup{display:none}
  .pack-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

  .pack-table tr{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr)}

  .origin-label{display:inline}

  .route-reward{display:flex;align-items:center}

  .map-head{padding:8px}
  #map-back{max-width:76px;font-size:12px;line-height:1.15}

/* ===== Academia: махагон / дуб / пергамент / латунь (ui-ux-pro-max, style 79) ===== */
:root{--font-head:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Georgia,serif;--font-body:Georgia,"Palatino Linotype",Cambria,serif}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink)}
h1{font-family:var(--font-head);font-size:28px;font-weight:600;letter-spacing:.08em;color:var(--acc);text-shadow:0 1px 2px #000}
h2{font-family:var(--font-head);font-size:22px;font-weight:600;letter-spacing:.06em;color:var(--acc)}
.card{border-radius:4px;box-shadow:0 4px 6px rgba(0,0,0,.4)}
.note{background:var(--warn);border-color:var(--line);color:var(--mute)}
input,select,button,textarea{font-family:inherit;border-radius:4px;background:var(--leather);color:var(--ink);border:1px solid var(--line)}
button{min-height:44px;padding:6px 14px;border-color:var(--acc);background:var(--card);transition:background .2s ease,border-color .2s ease}
button:hover{background:var(--leather)}
input,select{min-height:36px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pin span{font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:.04em}
th{background:var(--card);color:var(--acc);letter-spacing:.06em}
td,th{border-bottom-color:var(--line)}
footer a,details summary{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Плавные анимации ===== */
:root{--ease:cubic-bezier(.22,.61,.36,1);--t-fast:.18s;--t-med:.32s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes pinDrop{from{opacity:0;transform:translate(-50%,-160%)}to{opacity:1;transform:translate(-50%,-100%)}}
@keyframes march{to{stroke-dashoffset:-26}}
@keyframes sweep{from{background-position:-200% 0}to{background-position:200% 0}}
body{animation:fadeIn .5s var(--ease) both}
.card{animation:fadeUp var(--t-med) var(--ease) both;transition:box-shadow var(--t-med) var(--ease),transform var(--t-med) var(--ease)}
.card:hover{box-shadow:0 8px 16px rgba(0,0,0,.5)}
#left{animation:fadeIn .45s var(--ease) both}
button,input,select{transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
button:active{transform:scale(.97)}
.pin{transition:filter var(--t-med) var(--ease),scale var(--t-fast) var(--ease)}
.pin:hover{scale:1.15;z-index:5}
.pin.dst,.pin.org{animation:none}
body.boot .pin{animation:pinDrop .5s var(--ease) both}
body.boot .pin:nth-child(2){animation-delay:.08s}body.boot .pin:nth-child(3){animation-delay:.16s}body.boot .pin:nth-child(4){animation-delay:.24s}body.boot .pin:nth-child(5){animation-delay:.32s}body.boot .pin:nth-child(6){animation-delay:.4s}body.boot .pin:nth-child(7){animation-delay:.48s}
.mapin svg polyline{animation:march 1.2s linear infinite}
.mapinfo,.maptools{animation:fadeIn .5s var(--ease) .2s both}
tbody tr{transition:background var(--t-fast) var(--ease)}
tbody tr:hover{background:rgba(201,169,98,.08)}
a{transition:color var(--t-fast) var(--ease)}
details>*:not(summary){animation:fadeUp var(--t-med) var(--ease) both}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

var postById = {}, goodById = {};

function tr(){ return T[S.lang]; }
function nm(o){ return (o && (o[S.lang]||o.ru||o.en)) || "?"; }
function num(v){ var n = parseFloat(v); return isFinite(n)?n:null; }
function fmt(n,d){ if(n==null||!isFinite(n)) return "—"; return n.toLocaleString(S.lang==="ru"?"ru-RU":"en-US",{maximumFractionDigits:d==null?0:d}); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function cls(n){ return n>0?"pos":(n<0?"neg":""); }
function econOf(g){ return g && g.econ || null; }
function payout(g,pid){ var e=econOf(g); return e && e.pay[pid]; }
function autoSell(g,pid){ var e=econOf(g), v=e&&e.pay[pid]; return (v&&v.rate!=null) ? Math.round(e.base*v.rate/100) : null; }
function sellOf(g,pid){ var m=num(pr(g.id).sell[pid]); return m!=null ? m : autoSell(g,pid); }
function buyOf(g){ var b=num(pr(g.id).buy), e=econOf(g); if(!e) return b; if(saleOnly(g)) return b==null?0:b; return (b==null?0:b)+(e.pack||0); }
function pr(gid){ return S.prices[gid]||(S.prices[gid]={buy:"",sell:{}}); }
function timeKey(a,b){ return a<b ? a+"-"+b : b+"-"+a; }
var MAP_W=4914, MAP_H=2984, M_PER_PX=25500/1024/100, FULL_W=19656, FULL_H=11936; // размеры подложки и обрезки (tools/build_map.py)
function roadRoute(a,b){ var R=window.TR_ROADS; if(!R||a==null||b==null||String(a)===String(b)) return null; a=+a; b=+b;
  var k=Math.min(a,b)+"-"+Math.max(a,b), r=R.routes[k]; if(!r) return null;
  var pa=S.pos[a], pb=S.pos[b], da=R.pos[a], db=R.pos[b];
  if(!pa||!pb||!da||!db||pa[0]!==da[0]||pa[1]!==da[1]||pb[0]!==db[0]||pb[1]!==db[1]) return null; /* пины сдвинуты — маршрут по дорогам неактуален */
  return a<b ? r : r.slice().reverse(); }
function routeLen(r){ var L=0; for(var i=1;i<r.length;i++) L+=Math.hypot((r[i][0]-r[i-1][0])*FULL_W,(r[i][1]-r[i-1][1])*FULL_H); return L*M_PER_PX; }
function mapDist(a,b){ var p=S.pos[a], q=S.pos[b]; if(!p||!q) return null; var rr=roadRoute(a,b); if(rr) return routeLen(rr); return Math.hypot((p[0]-q[0])*FULL_W,(p[1]-q[1])*FULL_H)*M_PER_PX; }
function travel(a,b){ var m=num(S.times[timeKey(a,b)]); if(m!=null) return m; var d=mapDist(a,b), v=num(S.speed); return (d!=null && v>0) ? d/v : null; }

/* ---------- расчёт ---------- */
function qualityAt(group, minutes){
  var st = D.quality[group]; if(!st) return null;
  var cur = st[0]; // Better — начальное состояние
  st.forEach(function(s){ if(s.afterMs!=null && minutes*60000 >= s.afterMs) cur = s; });
  return cur;
}
// Возвращает {rev,tax,cost,profit,roi,unit,perHour,q} или null, если нет цен
function calc(buy, sell, qty, taxPct, extra, mins){
  if(buy==null || sell==null) return null;
  var q = null, bonus = 0;
  if(S.c.qUse){ q = qualityAt(S.c.qGroup, mins!=null?mins:(num(S.c.qTime)||0)); if(q) bonus = q.bp/10000; }
  var rev = sell*(1+bonus)*qty, tax = rev*taxPct/100, cost = buy*qty + extra;
  var profit = rev - tax - cost;
  return {rev:rev, tax:tax, cost:cost, profit:profit, roi: cost>0?profit/cost*100:null, unit: qty>0?profit/qty:null,
          perHour: mins>0 ? profit/(mins/60) : null, q:q};
}
function common(){ return {qty: Math.max(1, num(S.c.qty)||1), tax: num(S.c.tax)||0, extra: num(S.c.extra)||0}; }

function saleOnly(g){ return /Tempering Stone Chest$/.test(g.name.en); }
function legacyNotice(){ return S.lang==="ru"?"Только сдача готового сундука":"Existing chests can only be sold"; }
function searchText(value){ return (value||"").toLowerCase().replace(/ё/g,"е").trim(); }
function matchesName(name,query){
  return searchText(name.ru).includes(query) || searchText(name.en).includes(query);
}
function matchesPost(post,query){
  return matchesName(post.name,query) || searchText(shortPost(post)).includes(query);
}
function deliveryPosts(g){
  return D.posts.filter(function(p){return p.id!==g.origin && payout(g,p.id);})
    .sort(function(a,b){return (autoSell(g,b.id) ?? -1)-(autoSell(g,a.id) ?? -1);});
}
function rewardText(g,pid,reward){
  return reward.item ? nm(reward.item.name)+" ×"+fmt(reward.item.count) : fmt(autoSell(g,pid))+" "+tr().p_gold;
}

function renderCatalogRows(){
  var t=tr(), query=searchText(catalog.query), packs=0, html="";
  D.goods.forEach(function(g){
    if(catalog.origin && String(g.origin)!==catalog.origin) return;
    var e=econOf(g), allPosts=deliveryPosts(g);
    var matchesPack=!query || matchesName(g.name,query) || matchesPost(postById[g.origin],query)
      || (!saleOnly(g) && e && e.mats.some(function(m){return matchesName(m.name,query);}));
    var posts=allPosts.filter(function(post){
      var reward=payout(g,post.id), type=reward.item?"items":"gold";
      return (catalog.reward==="all" || catalog.reward===type)
        && (matchesPack || matchesPost(post,query) || (reward.item && matchesName(reward.item.name,query)));
    });
    if(!posts.length && (allPosts.length || !matchesPack || catalog.reward!=="all")) return;
    html+=renderPackRows(g,posts);
    packs++;
  });
  var table=document.getElementById("pack-table");
  while(table.tBodies.length) table.tBodies[0].remove();
  table.insertAdjacentHTML("beforeend",html);
  table.hidden=!packs;
  document.getElementById("catalog-empty").hidden=Boolean(packs);
  document.getElementById("catalog-count").textContent=t.p_results+" · "+fmt(packs);
  document.getElementById("catalog-origin").value=catalog.origin;
  document.querySelectorAll(".reward-filter button").forEach(function(button){
    button.setAttribute("aria-pressed",String(button.dataset.reward===catalog.reward));
  });
}

function renderPanel(){
  var t=tr(), panel=document.getElementById("left");
  panel.innerHTML='<div class="catalog-head"><h2 id="catalog-title">'+t.p_catalog+'</h2>'
    +'<div class="catalog-controls">'
    +'<input type="search" id="catalog-search" autocomplete="off" aria-label="'+t.p_search+'" placeholder="'+t.p_search+'" value="'+esc(catalog.query)+'">'
    +'<select id="catalog-origin" aria-label="'+t.p_allOrigins+'"><option value="">'+t.p_allOrigins+'</option>'
    +D.posts.map(function(post){return '<option value="'+post.id+'">'+esc(shortPost(post))+'</option>';}).join("")+'</select>'
    +'<div class="reward-filter" role="group" aria-label="'+t.p_filter+'">'
    +'<button type="button" data-reward="all">'+t.p_all+'</button>'
    +'<button type="button" data-reward="gold">'+t.p_goldFilter+'</button>'
    +'<button type="button" data-reward="items">'+t.p_itemFilter+'</button></div></div>'
    +'<p class="catalog-status"><span>'+(D.economySource==="questlog"?t.p_srcnote:t.p_baseRewards)+'</span>'
    +'<span id="catalog-count" role="status"></span></p></div>'
    +'<div class="catalog-scroll" id="catalog-scroll"><table id="pack-table" class="pack-table" role="table" aria-labelledby="catalog-title">'
    +'<colgroup><col class="col-pack"><col class="col-origin"><col class="col-dest"><col class="col-reward"></colgroup>'
    +'<thead role="rowgroup"><tr role="row">'+[t.p_packColumn,t.p_from,t.p_deliver,t.p_reward].map(function(title){
      return '<th scope="col" role="columnheader">'+title+'</th>';
    }).join("")+'</tr></thead></table><p id="catalog-empty" class="catalog-empty" hidden>'+t.p_noMatches+'</p></div>';
  renderCatalogRows();

  function refreshList(){
    renderCatalogRows();
    document.getElementById("catalog-scroll").scrollTop=0;
  }
  panel.querySelector("#catalog-search").oninput=function(){
    catalog.query=this.value;
    refreshList();
  };
  panel.querySelector("#catalog-origin").onchange=function(){
    setCatalogOrigin(this.value);
  };
  panel.querySelector(".reward-filter").onclick=function(event){
    var button=event.target.closest("[data-reward]");
    if(!button) return;
    catalog.reward=button.dataset.reward;
    refreshList();
  };
  panel.querySelector("#pack-table").onclick=function(event){
    var cell=event.target.closest(".route-post,.route-reward");
    if(!cell) return;
    var route=cell.closest("[data-to]");
    selectRoute(route.closest("[data-pack]").dataset.pack,route.dataset.to);
    if(S.c.to && window.matchMedia("(max-width:980px)").matches){
      var map=document.getElementById("mapcol");
      map.focus({preventScroll:true});
      map.scrollIntoView({block:"start",behavior:"instant"});
    }
  };
}
function setCatalogOrigin(pid){
  catalog.origin=pid;
  if(S.c.good && pid && origin()!==pid){S.c.good=""; S.c.to="";}
  renderCatalogRows();
  document.getElementById("catalog-scroll").scrollTop=0;
  drawMapOverlay();
  save();
}
function selectRoute(gid,pid){
  var g=goodById[gid];
  if(!payout(g,pid)) return;
  var clear=S.c.good===gid && S.c.to===pid;
  S.c.good=clear?"":gid;
  S.c.to=clear?"":pid;
  document.querySelectorAll("#pack-table [data-to]").forEach(function(row){
    var selected=row.dataset.to===S.c.to && row.closest("[data-pack]").dataset.pack===S.c.good;
    row.classList.toggle("selected",selected);
    row.querySelector("button").setAttribute("aria-pressed",String(selected));
  });
  renderCalc();
  drawMapOverlay();
  if(S.c.to) frameMap(roadRoute(g.origin,pid)||[S.pos[g.origin],S.pos[pid]]);
  save();
}
function frameMap(points){
  var box=document.getElementById("mapbox"), valid=points.filter(Boolean);
  if(!valid.length || !box.clientWidth || !box.clientHeight) return;
  var xs=valid.map(function(p){return p[0]*MAP_W;}), ys=valid.map(function(p){return p[1]*MAP_H;});
  var minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  var fit=Math.min((box.clientWidth-150)/Math.max(1,maxX-minX),(box.clientHeight-92)/Math.max(1,maxY-minY));
  S.zoom=Math.max(MIN_ZOOM,Math.min(S.zoom,fit));
  applyZoom();
  box.scrollLeft=(minX+maxX)*S.zoom/2-box.clientWidth/2;
  box.scrollTop=(minY+maxY)*S.zoom/2-box.clientHeight/2;
}
function renderMap(){
  var t=tr(), el=document.getElementById("sec-map"), oldScroll=document.getElementById("catalog-scroll");
  var scrollTop=oldScroll?oldScroll.scrollTop:0;
  el.innerHTML='<aside id="left" aria-labelledby="catalog-title"></aside>'
   +'<div id="mapcol" role="region" aria-label="'+t.p_mapLabel+'" tabindex="-1"><div class="map-head"><div class="mapinfo" id="map-info" role="status"></div>'
   +'<div class="maptools"><button type="button" id="map-back">'+t.p_back+'</button>'
   +'<button type="button" id="map-zi" aria-label="'+t.p_zoomIn+'">+</button><button type="button" id="map-zo" aria-label="'+t.p_zoomOut+'">−</button></div></div>'
   +'<div class="mapbox" id="mapbox"><div class="mapin" id="mapin"><img class="bg" src="../assets/trade/worldmap.jpg" alt="" draggable="false"><svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg></div></div></div>';
  applyZoom();
  drawMapOverlay();
  renderPanel();
  document.getElementById("catalog-scroll").scrollTop=scrollTop;
  var box=document.getElementById("mapbox"), inner=document.getElementById("mapin");
  if(S.c.to) frameMap(roadRoute(origin(),S.c.to)||[S.pos[origin()],S.pos[S.c.to]]);
  else frameMap(Object.values(S.pos));

  document.getElementById("map-back").onclick=function(){
    document.getElementById("left").scrollIntoView({block:"start",behavior:"instant"});
    var focus=document.querySelector("#pack-table .selected button")||document.getElementById("catalog-search");
    focus.focus({preventScroll:true});
  };
  function zoomTo(z){
    var cx=(box.scrollLeft+box.clientWidth/2)/S.zoom, cy=(box.scrollTop+box.clientHeight/2)/S.zoom;
    S.zoom=Math.max(MIN_ZOOM,Math.min(1.5,z));
    applyZoom();
    box.scrollLeft=cx*S.zoom-box.clientWidth/2;
    box.scrollTop=cy*S.zoom-box.clientHeight/2;
    save();
  }
  document.getElementById("map-zi").onclick=function(){zoomTo(S.zoom*1.4);};
  document.getElementById("map-zo").onclick=function(){zoomTo(S.zoom/1.4);};
  box.addEventListener("wheel",function(e){e.preventDefault(); zoomTo(S.zoom*(e.deltaY<0?1.2:1/1.2));},{passive:false});
  function toRel(e){
    var r=inner.getBoundingClientRect();
    return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];
  }
  var drag=null;
  box.addEventListener("pointerdown",function(e){
    if(e.button!==0) return;
    drag={pin:e.target.closest(".pin"),x:e.clientX,y:e.clientY,sl:box.scrollLeft,st:box.scrollTop,moved:false};
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener("pointermove",function(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    if(!drag.moved) return;
    if(drag.pin && S.place){
      var id=drag.pin.dataset.id;
      S.pos[id]=toRel(e);
      drag.pin.style.left=S.pos[id][0]*100+"%";
      drag.pin.style.top=S.pos[id][1]*100+"%";
    } else {
      box.scrollLeft=drag.sl-dx;
      box.scrollTop=drag.st-dy;
    }
  });
  box.addEventListener("pointercancel",function(){drag=null;});
  box.addEventListener("pointerup",function(e){
    if(!drag) return;
    var d=drag;
    drag=null;
    if(!d.moved && d.pin){
      var pid=d.pin.dataset.id, g=goodById[S.c.good];
      if(g && payout(g,pid)) selectRoute(String(g.id),pid);
      else {
        S.c.good=""; S.c.to="";
        setCatalogOrigin(catalog.origin===pid?"":pid);
      }
    } else if(S.place && (d.pin || S.sel)){
      if(!d.moved && S.sel) S.pos[S.sel]=toRel(e);
      drawMapOverlay();
      save();
    }
  });
}

function renderPrices(){
  if(!document.getElementById("sec-prices")) return;
  var t = tr();
  var h = '<h2>'+t.prices+'</h2><p class="mute">'+t.prices_hint+'</p>'
   +'<div class="row"><label>'+t.setPct+'<input type="number" id="pct" value="110" style="width:80px"></label>'
   +'<button id="pct-go">'+t.apply+'</button><button id="pr-reset">'+t.reset+'</button><button id="pr-exp">'+t.export+'</button><button id="pr-imp">'+t.import+'</button></div>'
   +'<div class="scroll"><table id="ptable"><thead><tr><th>'+t.c_good+'</th><th>'+t.from+'</th><th>'+t.buy+'</th>'
   + D.posts.map(function(p){return '<th>'+esc(shortPost(p))+'</th>';}).join("")+'</tr></thead><tbody>'
   + D.goods.map(function(g){
      var o = postById[g.origin];
      return '<tr><td>'+esc(nm(g.name))+'</td><td>'+esc(shortPost(o))+'</td>'
       +'<td><input type="number" data-buy="'+g.id+'" value="'+esc(pr(g.id).buy)+'"></td>'
       + D.posts.map(function(p){
          return p.id===g.origin ? '<td class="mute">—</td>' : '<td><input type="number" data-sell="'+g.id+':'+p.id+'" value="'+esc(pr(g.id).sell[p.id]||"")+'"></td>';
        }).join("")+'</tr>';
     }).join("")+'</tbody></table></div><div id="io"></div>';
  var s = document.getElementById("sec-prices"); s.innerHTML = h;
  s.querySelector("#ptable").addEventListener("input", function(e){
    var d = e.target.dataset;
    if(d.buy) pr(d.buy).buy = e.target.value;
    else if(d.sell){ var a=d.sell.split(":"); pr(a[0]).sell[a[1]] = e.target.value; }
    save(); renderRoutes(); renderCalcOut();
    var cb=document.getElementById("c-buy"), cs=document.getElementById("c-sell"), g=goodById[S.c.good];
    if(cb && g && document.activeElement!==cb){ cb.value = pr(g.id).buy; } if(cs && g && S.c.to && document.activeElement!==cs){ cs.value = pr(g.id).sell[S.c.to]||""; }
  });
  document.getElementById("pct-go").onclick = function(){
    var k = num(document.getElementById("pct").value); if(k==null) return;
    D.goods.forEach(function(g){ var b=num(pr(g.id).buy); if(b==null) return; D.posts.forEach(function(p){ if(p.id!==g.origin) pr(g.id).sell[p.id] = Math.round(b*k/100); }); });
    save(); renderAll();
  };
  document.getElementById("pr-reset").onclick = function(){ S.prices={}; save(); renderAll(); };
  document.getElementById("pr-exp").onclick = function(){
    document.getElementById("io").innerHTML = '<p class="mute">'+t.exported+'</p><textarea style="width:100%;height:90px" readonly>'+esc(JSON.stringify({prices:S.prices,times:S.times,pos:S.pos,speed:S.speed}))+'</textarea>';
  };
  document.getElementById("pr-imp").onclick = function(){
    document.getElementById("io").innerHTML = '<p class="mute">'+t.importAsk+'</p><textarea id="io-t" style="width:100%;height:90px"></textarea><button id="io-go">OK</button>';
    document.getElementById("io-go").onclick = function(){
      try{ var o = JSON.parse(document.getElementById("io-t").value); if(o.prices) S.prices=o.prices; if(o.times) S.times=o.times; if(o.pos) S.pos=o.pos; if(o.speed!=null) S.speed=o.speed; save(); renderAll(); }catch(e){ alert("JSON?"); }
    };
  };
}

function routeRows(){
  var cm = common(), rows = [];
  D.goods.forEach(function(g){
    var buy = buyOf(g); if(buy==null) return;
    D.posts.forEach(function(p){
      if(p.id===g.origin) return;
      var sell = sellOf(g,p.id); if(sell==null) return;
      var mins = travel(g.origin, p.id); if(mins==null) mins = S.c.qUse ? num(S.c.qTime) : null;
      var r = calc(buy, sell, cm.qty, cm.tax, cm.extra, mins);
      if(r) rows.push({g:g, from:postById[g.origin], to:p, buy:buy, sell:sell, r:r, mins:travel(g.origin,p.id)});
    });
  });
  var key = {profit:function(x){return x.r.profit;}, roi:function(x){return x.r.roi==null?-1e18:x.r.roi;}, hour:function(x){return x.r.perHour==null?-1e18:x.r.perHour;}}[S.r.sort];
  rows.sort(function(a,b){ return key(b)-key(a); });
  return rows;
}
var NOM_RU={1000:"Гавань Морского Стекла",1100:"Деревня Дозорных",2000:"Водный Дрейф",2100:"Деревня Ликования",3000:"Деревня Звездочётов",3100:"Храм Тропы Теней"};
function shortPost(p){ if(S.lang==="ru"&&NOM_RU[p.id]) return NOM_RU[p.id]; if(S.lang==="en") return nm(p.name); return nm(p.name).replace(/^Торговый пост |\s?Trading Post$/,""); }

   +'<label>'+t.limit+'<select id="r-lim">'+[10,30,100,1000].map(function(n){return '<option'+(+S.r.limit===n?" selected":"")+'>'+n+'</option>';}).join("")+'</select></label></div>';
  var rows = routeRows();
  if(!rows.length) h += '<p class="mute">'+t.noRoutes+'</p>';
  else h += '<div class="scroll"><table id="rtable"><thead><tr><th>'+t.c_good+'</th><th>'+t.c_route+'</th><th class="num">'+t.c_buy+'</th><th class="num">'+t.c_sell+'</th><th class="num">'+t.c_unit
   +'</th><th class="num">'+t.c_profit+'</th><th class="num">'+t.c_roi+'</th><th class="num">'+t.c_hour+'</th><th class="num">'+t.c_min+'</th></tr></thead><tbody>'
   + rows.slice(0, +S.r.limit).map(function(x){
      return '<tr><td>'+esc(nm(x.g.name))+'</td><td>'+esc(shortPost(x.from))+' → '+esc(shortPost(x.to))+'</td><td class="num">'+fmt(x.buy)+'</td><td class="num">'+fmt(x.sell)
       +'</td><td class="num">'+fmt(x.r.unit,1)+'</td><td class="num '+cls(x.r.profit)+'">'+fmt(x.r.profit)+'</td><td class="num">'+(x.r.roi==null?"—":fmt(x.r.roi,1)+" %")
       +'</td><td class="num">'+(x.r.perHour==null?"—":fmt(x.r.perHour))+'</td><td class="num">'+(x.mins==null?"—":fmt(x.mins))+'</td></tr>';
     }).join("")+'</tbody></table></div>';
  el.innerHTML = h;
  document.getElementById("r-sort").onchange = function(){ S.r.sort=this.value; save(); renderRoutes(); };
  document.getElementById("r-lim").onchange = function(){ S.r.limit=this.value; save(); renderRoutes(); };
}
