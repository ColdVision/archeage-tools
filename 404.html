<style>
:root{--bg:#0A1016;--card:#111A23;--ink:#E7EEF5;--mute:#8DA0B3;--line:#243342;--acc:#4FD1C0;--leather:#182533}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Inter,Arial,system-ui,sans-serif;padding:16px}
.c{max-width:520px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 22px;box-shadow:0 4px 6px rgba(0,0,0,.4)}
h1{font-family:"Segoe UI",Inter,Arial,sans-serif;font-size:64px;font-weight:700;letter-spacing:.02em;color:var(--acc);margin:0;text-shadow:0 1px 2px #000}
p{color:var(--mute)}
a{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;margin:4px;border:1px solid var(--acc);border-radius:4px;background:var(--leather);color:var(--ink);text-decoration:none}
a:hover,a:focus-visible{background:var(--acc);color:#04201c;outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="c">
  <h1>404</h1>
  <p id="m">Такой страницы нет.</p>
  <p><a id="h" href="index.html">На главную</a></p>
</div>
<script>
(function () {
  /* 404 открывается по любому адресу, поэтому корень сайта определяем из адреса: на *.github.io/<репозиторий>/ это первый сегмент пути */
  var root = "/";
  if (/\.github\.io$/i.test(location.hostname)) { var seg = location.pathname.split("/")[1]; if (seg) root = "/" + seg + "/"; }
  document.getElementById("h").href = root + "index.html";
  var en = false; try { en = localStorage.getItem("aa.lang") === "en"; } catch (e) {}
  if (en) { document.documentElement.lang = "en"; document.getElementById("m").textContent = "This page does not exist."; document.getElementById("h").textContent = "Home"; }
})();
</script>
</body>
