li.new{animation:nodeIn var(--t-med) var(--ease) both;animation-delay:calc(var(--d,0) * 50ms)}

.ci .ic{transition:transform var(--t-fast) var(--ease)}.ci:hover .ic{transform:scale(1.12)}
.nd{transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.nd.exp:hover{transform:translateY(-2px);box-shadow:0 6px 14px #000a}.nd.exp:active{transform:translateY(0) scale(.98)}

/* горизонтальное дерево: корень слева, ингредиенты раскрываются вправо (переопределяет вертикальную схему .org выше) */

<script>
"use strict";
const D = window.CRAFTDATA, SEED = window.CRAFT_RECIPES || [];
const items = new Map(D.items.map(i => [i.id, i]));
const SK = {Alchemy:"Алхимия",Carpentry:"Плотничество",Cooking:"Кулинария",Engineering:"Инженерия",Jewealry:"Ювелирное дело",Milling:"Помол",Smelting:"Плавка",Smithing:"Кузнечное дело",Tailoring:"Портняжное дело",Trimming:"Обработка",Exploring:"Исследование",Farming:"Земледелие",Gathering:"Собирательство",Hunting:"Охота",Mining:"Горное дело"};
const CAT = {Consumable:"Расходуемое",CraftMaterial:"Материал",CraftRecipe:"Свиток рецепта",Equipment:"Снаряжение",Etc:"Прочее",FullMoonStone:"Камень полнолуния",HousingBuilding:"Здание",HousingBuildingDrawing:"Чертёж здания",HousingObject:"Предмет обстановки",HousingPermit:"Разрешение на жильё",Jewel:"Самоцвет",Memo:"Записка",PolishingMaterial:"Материал полировки",QuestItem:"Квестовый",Repairer:"Ремонт",TearsOfNui:"Слёзы Нуи",WayPoint:"Путевая точка"};

// ---------- состояние ----------
const LSK = "craftcalc.v1";
let S = {lang:"ru", target:null, qty:1, fee:0, prices:{}, choice:{}, have:{}, open:{}, recipes:[], nextId:1};
try { Object.assign(S, JSON.parse(localStorage.getItem(LSK) || "{}")); } catch (e) {}
S.lang = AA.lang;
function save() { try { localStorage.setItem(LSK, JSON.stringify(S)); } catch (e) {} }

const $ = id => document.getElementById(id);
const h = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "—" : (Math.round(n * 100) / 100).toLocaleString("ru-RU");
function nm(id) { const i = items.get(id); if (!i) return "#" + id; return (S.lang === "ru" ? (i.ru || i.en) : (i.en || i.ru)) || ("#" + id); }
const allRecipes = () => SEED.map(r => ({...r, seed:true})).concat(S.recipes);
const recipesFor = id => allRecipes().filter(r => r.out === id);
const price = id => { const p = S.prices[id]; return (p === undefined || p === "" || p === null) ? null : Number(p); };

// обратный индекс разбора: предмет -> [{src, per}]
const rev = new Map();
for (const it of D.items) if (it.disasm && D.disasm[it.disasm]) for (const [tid, y] of D.disasm[it.disasm]) {
  if (!rev.has(tid)) rev.set(tid, []); rev.get(tid).push({src: it.id, per: y});
}

// ---------- расчёт ----------
let stock = {};
function plan(id, qty, stack, isRoot) {
  const recs = recipesFor(id), p = price(id);
  let total = qty, haveUsed = 0;
  if (!isRoot) { haveUsed = Math.min(stock[id] || 0, qty); if (haveUsed > 0) { stock[id] -= haveUsed; qty -= haveUsed; } }
  if (qty <= 0) return {item:id, qty:0, total, haveUsed, mode:"have", cost:0, miss:[], unit:0, recipes:recs, choice:S.choice[id] || "auto"};
  const buyOpt = () => ({mode:"buy", cost: p == null ? null : p * qty, miss: p == null ? [id] : []});
  const craftOpt = r => {
    const runs = Math.ceil(qty / (r.outQty || 1));
    const kids = r.ing.map(g => plan(g.item, g.qty * runs, stack.concat(id), false));
    let miss = []; let cost = (r.fee || 0) * runs;
    for (const k of kids) { cost += k.cost || 0; miss = miss.concat(k.miss); }
    return {mode:"craft", rec:r, runs, kids, cost, miss, made: runs * (r.outQty || 1)};
  };
  let usable = stack.includes(id) ? [] : recs;
  const ch = S.choice[id];
  let node;
  if (ch === "buy" && !isRoot) node = buyOpt();
  else if (ch && ch !== "auto" && ch !== "buy") { const r = usable.find(x => x.id === ch); node = r ? craftOpt(r) : null; }
  if (!node) {
    const opts = usable.map(craftOpt);
    if (!isRoot) opts.push(buyOpt());
    // выбираем самый дешёвый среди полностью оценённых; иначе — первый вариант с рецептом, иначе покупка
    // если рецепт известен — ветка всегда раскрывается (покупка только по явному выбору)
    const crafts = opts.filter(o => o.mode === "craft");
    const full = crafts.filter(o => !o.miss.length && o.cost != null);
    if (full.length) node = full.reduce((a, b) => b.cost < a.cost ? b : a);
    else node = crafts[0] || opts[0] || buyOpt();
  }
  node.item = id; node.qty = qty; node.total = total; node.haveUsed = haveUsed; node.recipes = recs; node.choice = ch || "auto";
  node.unit = node.cost != null ? node.cost / qty : null;
  return node;
}
function walk(n, f) { f(n); if (n.kids) n.kids.forEach(k => walk(k, f)); }
function altCosts(id, qty) { // стоимости вариантов для одного узла (для подсказок)
  const sv = stock; stock = {}; try { return altCosts2(id, qty); } finally { stock = sv; } }
function altCosts2(id, qty) {
  const out = []; const p = price(id);
  out.push({key:"buy", label:"Купить", cost: p == null ? null : p * qty});
  recipesFor(id).forEach((r, i) => { const runs = Math.ceil(qty / (r.outQty || 1));
    let c = (r.fee || 0) * runs, miss = false;
    for (const g of r.ing) { const k = plan(g.item, g.qty * runs, [id], false); c += k.cost || 0; if (k.miss.length) miss = true; }
    out.push({key:r.id, label:"Рецепт " + (i + 1) + (r.note ? " (" + r.note + ")" : ""), cost: miss ? null : c}); });
  return out;
}

// ---------- иконки ----------
function ico(id, cls) {
  const it = items.get(id);
  if (!it || !it.ic) return '<span class="ic ' + (cls || "") + '"></span>';
  return '<img class="ic ' + (cls || "") + '" src="../assets/craft/icons/' + it.ic + '.png" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">';
}
// ---------- вкладки крафта (как в игре) и выезжающая панель ----------
const TABS = (window.CRAFTING && window.CRAFTING.tabs) || [];
const F = {tab:null, subs:new Set(), q:""};
const tabCount = t => t.subs.reduce((n, x) => n + x.items.length, 0);
function renderNav() {
  const q = F.q.trim().toLowerCase();
  $("nav").innerHTML = TABS.map(t => {
    const rows = t.subs.map(sb => ({sb, es: sb.items.filter(e => !q || nm(e.i).toLowerCase().includes(q) || (items.get(e.i).en || "").toLowerCase().includes(q))})).filter(x => x.es.length);
    if (q && !rows.length) return "";
    const open = q ? true : F.tab === t.key;
    let h2 = '<button class="nv' + (open ? " on" : "") + '" data-s="' + t.key + '"><span><span class="ch">' + (open ? "▾" : "▸") + "</span>" + h(t.ru) + "</span><small>" + tabCount(t) + "</small></button>";
    if (open) { let ix = 0; h2 += '<div class="grp' + (F.anim === t.key ? " in" : "") + '">' + rows.map(({sb, es}) => { const so = q || F.subs.has(t.key + "/" + sb.key); return '<button class="sb' + (so ? " on" : "") + '" data-sub="' + t.key + "/" + sb.key + '"><span><span class="ch">' + (so ? "▾" : "▸") + "</span>" + h(sb.ru) + "</span><small>" + es.length + "</small></button>" + (so ? '<div class="sg' + (F.animSub === t.key + "/" + sb.key ? " in" : "") + '">' : "") + (so ? es : []).map(e => '<button style="--d:' + Math.min(ix++, 14) + '" class="ci' + (e.l ? " lk" : "") + (e.i === S.target ? " on" : "") + '" data-i="' + e.i + '" data-r="' + (e.r || "") + '" title="' + (e.l ? "Рецепт не изучен" : "") + '">' + ico(e.i) +
      '<span class="cn"><span class="gr-' + (items.get(e.i).grade || "") + '">' + h(nm(e.i)) + (e.q > 1 ? " ×" + e.q : "") + "</span>" + (e.l ? "<small>рецепт закрыт</small>" : "") + "</span></button>").join("") + (so ? "</div>" : ""); }).join("") + "</div>"; }
    return h2;
  }).join("") || '<div class="mut" style="padding:10px">Ничего не найдено</div>';
  $("nav").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { F.tab = F.tab === b.dataset.s ? null : b.dataset.s; F.anim = F.tab; renderNav(); F.anim = null; });
  $("nav").querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { const k = b.dataset.sub; if (F.subs.has(k)) F.subs.delete(k); else { F.subs.add(k); F.animSub = k; } renderNav(); F.animSub = null; });
  $("nav").querySelectorAll("[data-i]").forEach(b => b.onclick = () => { S.target = +b.dataset.i; if (b.dataset.r) S.choice[b.dataset.i] = b.dataset.r; else delete S.choice[b.dataset.i]; save(); render(); });
}
function initNav() { $("navQ").oninput = e => { F.q = e.target.value; renderNav(); }; }

// ---------- отрисовка ----------
function render() {
  const t = S.target, it = t && items.get(t);
  $("qty").value = S.qty;
  renderNav();
  if (!it) { for (const id of ["tree"]) $(id).innerHTML = '<span class="mut">Выберите предмет в разделах слева.</span>'; renderRes(null); return; }
  stock = {...S.have};
  const root = plan(t, S.qty, [], true); const leftover = stock;
  renderNav(); renderTree(root);
}
let ctl = new Set();
function nodeHTML(n, depth) {

  const hasKids = !!(n.kids && n.kids.length), open = !!S.open[n.item];

    (n.mode === "craft" ? "крафт" + (n.runs > 1 ? " ×" + n.runs : "") + (n.made > n.qty ? ", излишек " + (n.made - n.qty) : "") : (n.recipes.length ? "покупка" : "сырьё"));

    (hasKids && !root ? '<span class="arr">' + (open ? "▾" : "▸") + "</span>" : "") +
    (!root ? '<button class="tgb" data-cfg="' + n.item + '" title="Настройки: способ получения, есть на складе">⚙</button>' : "") + "</div>";

function renderRes(root) {
  // ресурсы по видимой части дерева: раскрытые узлы заменяются своими составляющими
  const need = new Map();
  const walk = (n, top) => {
    if (n.qty <= 0) return;
    if (n.kids && n.kids.length && (top || S.open[n.item])) { n.kids.forEach(k => walk(k, false)); return; }
    const e = need.get(n.item) || {q: 0, craft: !!(n.kids && n.kids.length)};
    e.q += n.qty; need.set(n.item, e);
  };
  if (root) walk(root, true);
  const rows = [...need].sort((a, b) => (a[1].craft - b[1].craft) || nm(a[0]).localeCompare(nm(b[0])));
  const seen = new Map(); let nIdx = 0;
  $("resList").innerHTML = rows.length ? rows.map(([id, e]) => { seen.set(id, e.q); const cls = !prevRes.has(id) ? " new" : prevRes.get(id) !== e.q ? " chg" : ""; return '<div class="rr' + cls + '" style="--d:' + (cls === " new" ? Math.min(nIdx++, 12) : 0) + '">' + ico(id) + '<span class="cn"><span class="gr-' + (items.get(id).grade || "") + '">' + h(nm(id)) + "</span>" + (e.craft ? "<small>крафт (ветка закрыта)</small>" : "") + "</span><b>" + e.q + "×</b></div>"; }).join("") : '<span class="mut">Выберите предмет.</span>';

}
function fitTree() {
  // автоматический масштаб: дерево целиком помещается по ширине (минимум 35%)
  const box = $("tree"), ul = box.querySelector(":scope>ul"); if (!ul || !box.clientWidth) return;
  ul.style.zoom = 1;
  const w = ul.getBoundingClientRect().width, avail = box.clientWidth - 12;
  ul.style.zoom = w > avail ? Math.max(0.35, avail / w).toFixed(3) : 1;
}
window.addEventListener("resize", () => fitTree());
let prevKeys = new Set(), prevTarget = null, prevRes = new Map();
function markNew() {
  const keys = new Set(), fresh = prevTarget !== S.target + "|" + S.qty;
  $("tree").querySelectorAll("li").forEach(li => {
    const chain = []; for (let e = li; e && e.id !== "tree"; e = e.parentElement) if (e.tagName === "LI") chain.unshift(e.querySelector(":scope>.nw>.nd,:scope>.nd")?.dataset.nd);

function uiText(root) {

  const todo = []; for (; n; n = w.nextNode()) todo.push(n);
